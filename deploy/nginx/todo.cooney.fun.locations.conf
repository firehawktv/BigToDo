# Custom location blocks for todo.cooney.fun
#
# NOT a standalone nginx config. CloudPanel's `clpctl site:add:static`
# generates the surrounding server {} block (listen, server_name, root,
# ssl_certificate*, access_log/error_log, `include /etc/nginx/global_settings;`,
# the HTTP->HTTPS redirect, and a default `location / { try_files $uri $uri/
# /index.html; }`) the same way it did for the gifts.cooney.fun precedent
# (confirmed live via `cat /etc/nginx/sites-enabled/gifts.cooney.fun.conf`).
# These blocks are meant to be pasted into that generated file, before its
# closing `}`, replacing its default `location /` with the one below (same
# try_files fallback, kept here only so this file is self-contained and
# diffable against the generated one).
#
# See deploy/vps-site-setup-commands.md for the full, human-reviewable
# command sequence this splices into (Task 5 territory - not run here).

# Static assets: long cache lifetime, since Vite fingerprints filenames
# (e.g. index-a1b2c3.js) — a changed file is a changed URL, so caching
# aggressively here is safe and correct, not stale-content risk.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# The service worker must NEVER be cached aggressively — it's how the
# browser discovers a new deployed version. A cached sw.js means a user's
# installed PWA silently never updates.
location = /sw.js {
    add_header Cache-Control "no-cache";
}

# The web app manifest must also never be cached aggressively, for the same
# reason as sw.js (icon/theme-color/name changes should reach installed
# PWAs promptly).
#
# It also needs an explicit content-type override: Debian/Ubuntu's stock
# nginx-common `mime.types` (confirmed by Task 3's live testing against
# this same VPS) has no entry for the `.webmanifest` extension, so without
# this it falls through to `default_type` (typically
# `application/octet-stream`) instead of the `application/manifest+json`
# browsers expect when fetching the manifest.
location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

# API traffic: reverse-proxy to the backend container on host port 3002
# (confirmed by Task 1 — port 3000 is already taken by an unrelated app on
# this shared VPS), stripping /api — matches exactly what the frontend's
# dev-time Vite proxy does (see frontend/vite.config.ts's server.proxy
# rewrite), so apiFetch's relative /api/... calls need zero code change
# between environments.
#
# NOTE on why 3002, not 3001: this task's live investigation found that
# gifts.cooney.fun's own nginx config still proxies to 127.0.0.1:3001, for
# a different (currently-stopped) backend — confirmed by `cat`'ing its
# live sites-enabled config. Nothing was listening on 3001 at
# investigation time, but since that backend's own config still claims
# the port, it could start listening again later. Rather than risk that
# collision, this app was moved to 3002 instead (confirmed free, and not
# referenced by any other site's nginx config on this box). Task 5 should
# still re-run `ss -ltnp | grep 3002` immediately before starting this
# app's backend, as a final live check before binding it.
location /api/ {
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else falls through to index.html — this app has no
# URL-based client-side routing as of plan 4 (confirmed in that plan's
# Task 3), so in practice this only ever serves the root page itself, but
# it's included as a safe default for any future client-side route.
#
# This replaces (not adds to) CloudPanel's own default `location /` block
# generated by `site:add:static` — same try_files fallback, so behavior is
# unchanged; it's listed here only so the splice target is unambiguous.
location / {
    try_files $uri $uri/ /index.html;
}
